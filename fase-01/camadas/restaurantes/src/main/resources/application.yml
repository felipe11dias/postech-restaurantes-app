spring:
  application:
    name: restaurantes

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurantes-app}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

security:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-grande-de-no-minimo-256-bits}
    expiration: ${JWT_EXPIRATION:3600000}

mail:
  from: ${MAIL_FROM:no-reply@restaurantes.postech}
  reset-token-expiration-minutes: ${MAIL_RESET_TOKEN_EXPIRATION_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator: exposição controlada de endpoints de monitoramento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
