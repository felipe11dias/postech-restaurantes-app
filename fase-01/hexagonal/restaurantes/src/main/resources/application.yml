spring:
  application:
    name: restaurantes-hexagonal

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurantes-hex}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

security:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-grande-de-no-minimo-256-bits}
    expiration: ${JWT_EXPIRATION:3600000}

mail:
  from: ${MAIL_FROM:no-reply@restaurantes.postech}
  reset-token-expiration-minutes: ${MAIL_RESET_TOKEN_EXPIRATION_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Actuator: exposição controlada de endpoints de monitoramento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # O envio de e-mail é best-effort por decisão de projeto: uma queda do SMTP não
    # impede a API de atender requisição nenhuma (ver SendPasswordResetMailPort).
    # Com este indicador ligado, porém, um SMTP fora do ar faz /actuator/health
    # responder 503 e a aplicação inteira ser considerada DOWN — o que derrubaria o
    # container em qualquer orquestrador, por um canal auxiliar indisponível.
    mail:
      enabled: false
